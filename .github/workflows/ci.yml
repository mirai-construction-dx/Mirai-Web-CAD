name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  synthetic-corpus:
    name: Synthetic DXF Generation and Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m venv /tmp/corpus-venv
      - run: /tmp/corpus-venv/bin/pip install -r DXF-Test-Corpus/requirements.txt
      - run: /tmp/corpus-venv/bin/python DXF-Test-Corpus/build_corpus.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Verify original DXF archive byte equality (not editable compatibility)
        run: node scripts/dxf-source-archive.mjs pack DXF-Test-Corpus artifacts/dxf-source-archive
      - run: npm ci
      - name: Generate limited native BLOCK roundtrips, including edits
        run: node scripts/check-native-block-corpus.mjs
      - name: Compare against original geometry and attributes with ezdxf
        run: /tmp/corpus-venv/bin/python scripts/audit-native-block-corpus.py
      - name: Upload generation audit (not CAD compatibility certification)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: synthetic-corpus-audit
          path: |
            DXF-Test-Corpus/00_manifest/verification.json
            artifacts/dxf-source-archive/report.json
            artifacts/native-block-corpus/report.json
            artifacts/native-block-corpus/audit.json
          retention-days: 14

  application:
    name: Lint, Test, Build, E2E, A11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  migration:
    name: Empty PostgreSQL Migration
    runs-on: ubuntu-latest
    services:
      # 本番(ローカルPostgreSQL 16.14)とメジャーバージョンを一致させる。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mirai
          POSTGRES_PASSWORD: mirai_ci_only
          POSTGRES_DB: mirai_web_cad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mirai -d mirai_web_cad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mirai:mirai_ci_only@127.0.0.1:5432/mirai_web_cad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: npm run db:verify
      # デプロイ経路が使う読み取り専用検査が、migration適用直後のDBで成立することを確認する。
      - run: npm run db:check

  postgres-integration:
    name: PostgreSQL Data Store Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mirai
          POSTGRES_PASSWORD: mirai_ci_only
          POSTGRES_DB: mirai_web_cad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mirai -d mirai_web_cad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mirai:mirai_ci_only@127.0.0.1:5432/mirai_web_cad_test
      TEST_DATABASE_URL: postgresql://mirai:mirai_ci_only@127.0.0.1:5432/mirai_web_cad_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:verify
      - run: npm test

  recovery:
    name: PostgreSQL Backup and Restore Drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mirai
          POSTGRES_PASSWORD: mirai_ci_only
          POSTGRES_DB: mirai_web_cad_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mirai -d mirai_web_cad_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mirai:mirai_ci_only@127.0.0.1:5432/mirai_web_cad_source
      RESTORE_DATABASE_URL: postgresql://mirai:mirai_ci_only@127.0.0.1:5432/mirai_web_cad_recovery
      BACKUP_FILE: artifacts/mirai-web-cad.dump
      ALLOW_DATABASE_RESTORE: "yes"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: npm run db:verify
      - name: Create empty recovery database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database mirai_web_cad_recovery"
      - run: npm run db:backup
      - name: Verify non-empty recovery database is rejected
        run: |
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create table restore_guard (id integer)"
          if npm run db:restore; then
            echo "restore unexpectedly accepted a non-empty database" >&2
            exit 1
          fi
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "drop table restore_guard"
      - run: npm run db:restore

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan repository
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          dir /repo --redact --no-banner

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Fail on high/critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report dev-dependency vulnerabilities (non-blocking, tracked via Dependabot)
        if: always()
        run: npm audit --audit-level=high || true

  # 供給網統制(改善台帳P0-88)。ビルドに含まれる依存の一覧をCycloneDX形式で生成し、
  # 成果物として保存する。SBOM生成自体は方針判断を要さない技術的統制であり、
  # 法務判断が必要な「ライセンス方針の決定」とは分離して実施する。
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generate SBOM
        run: |
          mkdir -p artifacts
          npm sbom --sbom-format cyclonedx > artifacts/sbom.cdx.json
      - name: Validate SBOM
        run: |
          node -e "
          const fs = require('node:fs');
          const bom = JSON.parse(fs.readFileSync('artifacts/sbom.cdx.json', 'utf8'));
          if (bom.bomFormat !== 'CycloneDX') throw new Error('bomFormat is not CycloneDX');
          if (!Array.isArray(bom.components) || bom.components.length === 0) throw new Error('components is empty');
          console.log('SBOM ok: components=' + bom.components.length);
          "
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: artifacts/sbom.cdx.json

  terraform:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.1"
      - name: Check policy guardrails
        run: node scripts/check-cloudflare-iac.mjs
      - name: Check formatting
        run: terraform -chdir=infra/cloudflare fmt -check -recursive
      - name: Initialize providers without state backend
        run: terraform -chdir=infra/cloudflare init -backend=false
      - name: Validate configuration
        run: terraform -chdir=infra/cloudflare validate

  preview:
    name: Deploy Preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: [application, migration, recovery, secret-scan, dependency-audit, terraform]
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://pr-${{ github.event.number }}.mirai-web-cad.pages.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Dependabot起点のPRにはリポジトリのシークレットが渡らない(GitHubの仕様)。その場合
      # wranglerは「CLOUDFLARE_API_TOKENが必要」で失敗し、**必須ではないジョブが常に赤**に
      # なって真の異常を覆い隠す(改善台帳P0-21と同種の問題)。資格情報が無い実行では
      # 配信と検証をスキップし、noticeで理由を残す。
      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Preview skipped::Cloudflareの資格情報がこの実行へ渡されていないため、プレビュー配信と検証をスキップします(Dependabot起点のPRではシークレットが渡らない仕様)。本ジョブは必須チェックではありません。"
          fi
      - name: Deploy preview
        if: steps.cloudflare.outputs.available == 'true'
        run: >-
          npx wrangler pages deploy dist
          --project-name mirai-web-cad
          --branch "pr-${{ github.event.number }}"
          --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify preview
        if: steps.cloudflare.outputs.available == 'true'
        env:
          PREVIEW_URL: https://pr-${{ github.event.number }}.mirai-web-cad.pages.dev
        run: >-
          test "$(curl --retry 8 --retry-all-errors --silent --output /dev/null
          --write-out '%{http_code}' "$PREVIEW_URL/")" = "200"
